<style>
    * {
        margin: 0;
        padding: 0;
        border: 0;
        box-sizing: border-box;
    }

    html, body {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
    }

    .container {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        gap: 0;
        overflow: hidden;
    }

    .main-frame {
        display: block;
        flex: 1;
        height: 100%;
        min-width: 0;
        margin: 0;
        padding: 0;
        border: none;
    }

    .portrait-frame {
        display: block;
        flex: 0 0 calc(100vh * 9 / 16);
        width: calc(100vh * 9 / 16);
        height: 100%;
        margin: 0;
        padding: 0;
        border: none;
    }
</style>
